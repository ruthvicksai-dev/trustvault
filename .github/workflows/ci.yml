name: TrustVault CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Restrict default permissions to read-only
permissions:
  contents: read

# Concurrency group cancels redundant in-progress PR builds while allowing master pushes to finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Code Quality, Build & Security Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Dedicated disposable PostgreSQL service container for integration and RLS tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trustvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trustvault_test
      SESSION_SECRET: test-secret-with-minimum-32-chars-for-entropy-and-safety
      SUPABASE_STORAGE_BUCKET: trustvault-test-isolated
      FRONTEND_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies with strict lockfile
        run: npm ci

      - name: Verify workspace dependencies
        run: npm ls --depth=0

      - name: Run TypeScript typecheck across monorepo
        run: npm run typecheck

      - name: Run production builds (API & Web SPA)
        run: npm run build

      - name: Apply schema and RLS migrations to test database
        run: npm run db:migrate:test --workspace=apps/api

      - name: Run automated test suite (Unit, Integration, Security, and RLS)
        run: npm test
